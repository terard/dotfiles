env = { TERM = "xterm-256color" }

[window.padding]
x = 10
y = 10

[font]
normal.family = "BerkeleyMono Nerd Font"
bold.family = "BerkeleyMono Nerd Font"
italic.family = "BerkeleyMono Nerd Font"
size = 14.0

[colors]
draw_bold_text_with_bright_colors = true

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\\t"
save_to_clipboard = true

[general]
import = ["~/dotfiles/alacritty/.config/alacritty/catppuccin/catppuccin-macchiato.toml"]
