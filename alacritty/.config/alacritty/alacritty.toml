colors.draw_bold_text_with_bright_colors = true
#import = [ "~/.config/alacritty/themes/themes/solarized_dark.toml" ]
#import = [ "~/.config/alacritty/themes/themes/rose-pine-moon.toml" ]
import = [ "~/.config/alacritty/themes/themes/catppuccin_macchiato.toml" ]

[env]
TERM = "xterm-256color"

[window.padding]
x = 10
y = 10

[font]
size = 15
#AppleFontSmoothing = true

  [font.normal]
  family = "DankMono Nerd Font"
  style = "Regular"

  [font.bold]
  family = "DankMono Nerd Font"
  style = "Medium"

  [font.italic]
  family = "DankMono Nerd Font"
  style = "Light Italic"

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true
